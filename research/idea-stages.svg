    <g font-size="14" fill="#d5dee5"><text x="50" y="180">Veriler · kaynaklar · araçlar</text><text x="344" y="180">Görevler · roller · eleştiri</text><text x="638" y="180">BXW + YKB · tek EVA</text><text x="932" y="180">Fikir aşaması tamamlandı</text></g>
    <g font-size="25" fill="#ffb080"><text x="296" y="152">→</text><text x="590" y="152">→</text><text x="884" y="152">→</text></g>
