# SIMULATED wheel/IMU inputs; no Gazebo world pose and no global position fix.
# Initial odom pose is zero. The manifest spawn belongs to map -> rover_1/odom.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    map_frame: map
    odom_frame: rover_1/odom
    base_link_frame: rover_1/base_link
    world_frame: rover_1/odom
    # x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    # Fuse forward wheel velocity and the nonholonomic zero lateral constraint.
    # Do not treat the DiffDrive integrated pose as a global localization fix.
    odom0: /rover_1/odom_raw
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, false,
                   false, false, false]
    odom0_queue_size: 5
    odom0_differential: false
    odom0_relative: false
    odom0_nodelay: false
    # Fuse yaw rate only: absolute IMU/world yaw would apply spawn yaw twice.
    # No linear acceleration/gravity model is used by this planar filter.
    imu0: /rover_1/imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 5
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
