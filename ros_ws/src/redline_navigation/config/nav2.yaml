# T3 SCENARIO parameters, not a calibrated rover/hardware safety configuration.
# Geometry: chassis 1.7 x 1.0 m, wheels extend to x=+-0.98, y=+-0.715 m.
# The enclosing footprint and margins below are explicit scenario choices.
# The source map is DEM-derived at 4 m. Local LiDAR avoidance uses a 0.2 m grid.
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    node_names: [map_server, planner_server, controller_server, behavior_server,
                 velocity_smoother, collision_monitor, bt_navigator]
    bond_timeout: 4.0
    attempt_respawn_reconnection: false

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    costmap_update_timeout: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: redline_navigation::InterpolatingPlanner
      delegate_plugin: nav2_smac_planner::SmacPlannerHybrid
      densification_step: 0.2
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      # SCENARIO smooth-turn preference, not measured minimum hardware radius.
      # Jazzy Smac requires a radius >= the 4 m search-grid resolution.
      minimum_turning_radius: 4.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 20.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    odom_topic: /rover_1/odom
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.35
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_max: 0.4
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.4
      ax_max: 0.3
      ax_min: -0.4
      ay_max: 0.0
      ay_min: 0.0
      az_max: 0.4
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.2
      prune_distance: 3.0
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 4
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: rover_1/base_link
      transform_tolerance: 0.3
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 4.0
      track_unknown_space: true
      footprint: "[[1.0, 0.75], [1.0, -0.75], [-1.0, -0.75], [-1.0, 0.75]]"
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /rover_1/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        # Preserve intermediate DEM slope costs instead of binarizing them.
        trinary_costmap: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /rover_1/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 12.0
          obstacle_min_range: 0.15
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 2.0
        cost_scaling_factor: 3.0
      always_send_full_costmap: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: rover_1/odom
      robot_base_frame: rover_1/base_link
      transform_tolerance: 0.3
      update_frequency: 10.0
      publish_frequency: 2.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.2
      footprint: "[[1.0, 0.75], [1.0, -0.75], [-1.0, -0.75], [-1.0, 0.75]]"
      footprint_padding: 0.05
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /rover_1/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 12.0
          obstacle_min_range: 0.15
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.5
        cost_scaling_factor: 3.0
      always_send_full_costmap: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: rover_1/base_link
    odom_topic: /rover_1/odom
    transform_tolerance: 0.3
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Only this navigator is enabled so a second default BT cannot add recoveries.
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    # default_nav_to_pose_bt_xml is set to the installed bounded BT by launch.
    error_code_names: [compute_path_error_code, follow_path_error_code]

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: rover_1/odom
    global_frame: map
    robot_base_frame: rover_1/base_link
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    transform_tolerance: 0.3
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors::Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: CLOSED_LOOP
    scale_velocities: false
    max_velocity: [0.4, 0.0, 0.4]
    min_velocity: [0.0, 0.0, -0.4]
    max_accel: [0.3, 0.0, 0.4]
    max_decel: [-0.4, 0.0, -0.4]
    odom_topic: /rover_1/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: rover_1/base_link
    odom_frame_id: rover_1/odom
    enable_stamped_cmd_vel: false
    cmd_vel_in_topic: cmd_vel_gated
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [Stop, Slow]
    Stop:
      type: polygon
      points: "[[1.15, 0.9], [1.15, -0.9], [-1.15, -0.9], [-1.15, 0.9]]"
      action_type: stop
      min_points: 1
      enabled: true
      visualize: false
    Slow:
      type: polygon
      points: "[[2.0, 1.3], [2.0, -1.3], [-2.0, -1.3], [-2.0, 1.3]]"
      # An absolute cap avoids a feedback trap with CLOSED_LOOP smoothing:
      # repeatedly multiplying (measured velocity + acceleration step) by .3
      # settles at ~.0064 m/s. Preserve the original .4 * .3 maximum instead.
      action_type: limit
      linear_limit: 0.12
      angular_limit: 0.12
      min_points: 1
      enabled: true
      visualize: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: /rover_1/scan
      enabled: true
      source_timeout: 0.5
