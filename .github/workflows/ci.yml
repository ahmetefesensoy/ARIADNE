name: T0 build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ros:jazzy-ros-base-noble@sha256:00b8d47a6e6384a2834e3d01fa87ae767876543baa574f2d64a75c04ea33c698
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install declared ROS build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake python3-venv python3-colcon-common-extensions \
            python3-rosdep
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros_ws/src --ignore-src \
            --rosdistro jazzy -y

      - name: Create isolated Python environment
        run: bash scripts/bootstrap.sh

      - name: Run Python tests and colcon build/test
        run: bash scripts/test.sh

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t0-test-reports
          if-no-files-found: warn
          path: |
            test-results/
