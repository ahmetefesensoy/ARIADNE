# BXW science campaign: proje.md §9.2 surface tasks placed on DERIVED terrain targets (D020).
schema: redline.science_campaign.v1
provenance_status: SCENARIO
site_id: BXW
note: >-
  Design, not data. Station points come from data/derived/BXW/planning/targets_v1.json (TPI ridge /
  hollow on the 1 m HiRISE DTM, DERIVED); which task runs where, by whom and for how long are
  scenario choices. Compositions, hardness, WEH and pH are hidden SCENARIO truth for simulated
  instruments; the only archive-calibrated noise so far is APXS (D018). East stations repeat the
  pattern already reported at the east edge (control); west stations test whether it continues
  (the question). Distances from the habitat are 0.4-1.3 km, so fast travel is a presentation
  choice of the game client; the return line, PET and consumables stay in ROS.
sources:
  tasks: docs/proje.md §9.1-9.3 (B1-B10)
  question: config/science_BXW.yaml; research/proje-fikirleri/REDLINE_V3_KILAVUZU.md §3
  lab_analysis: research/notes/SAHA_VE_BILIM_ISTASYONU.md §4 (pH in the lab, bound to sample origin)
question:
  tr: >-
    Doğu kenarında görülen örüntü (kil zengini sırtlar, karbonat zengini çukurlar) kutu ağı
    yapısının batı uzantısında da sürüyor mu?
  en: >-
    Does the east-edge boxwork pattern (clay-rich ridges, carbonate-rich hollows) continue into the
    west extension?
mission_brief:
  tr: >-
    Bu EVA'nın amacı tek bir soruya cevap aramak: doğuda bilinen sırt-çukur örüntüsü batıda da var
    mı? Önce doğudaki iki kontrol istasyonunda aletlerimizi bilinen örüntü üzerinde sınarız. Sonra
    batıdaki test istasyonlarında aynı ölçümleri yaparız; rover en uzak batı alanını tarar. Her
    ölçüm haritaya ve inanç çubuğuna işlenir. Her dakika dönüş payından ödenir: kırmızı çizginin
    dışına çıkılmaz, alarm gelirse bilim bekler. Numuneler laboratuvara getirilir; pH ve bileşim
    orada ölçülür ve numunenin alındığı noktaya bağlanır. Sonuçlar simülasyondur: Mars'ta yeni bir
    keşif iddiası yoktur; amaç doğru kararı, doğru kanıtla, güvenle vermektir.
  en: >-
    This EVA asks one question: does the ridge-hollow pattern known in the east also hold in the
    west? First we check our instruments on the known pattern at two east control stations. Then we
    repeat the same measurements at the west test stations while the rover surveys the far west.
    Every measurement goes onto the map and the belief bar. Every minute is paid from the return
    margin: we never cross the red line, and science waits when an alarm comes. Samples go to the
    lab, where pH and composition are measured and tied to where each sample was taken. Results are
    simulated: there is no claim of a new discovery on Mars; the goal is the right decision, on the
    right evidence, safely.
tasks:
  B1_APXS_ARM:
    spec: proje.md §9.2 B1
    action: ContactScience
    actor: rover_1
    asset: assets/incoming/tool_apxs
    data: {status: DERIVED, note: "precision from the MSL APXS supplement fit (D018, apxs_precision_v1.json); composition SCENARIO"}
    duration_min: 30
    purpose:
      tr: "Rover kolu APXS'i kayaya değdirir; oksit kimyası hata çubuklarıyla gelir. İyi temas (az boşluk) uzun ölçümden daha çok kazandırır."
      en: "The rover arm places the APXS on the rock; oxide chemistry comes with error bars. Good contact (small standoff) gains more than a long count."
  B1_XRF_HAND:
    spec: proje.md §9.2 B10
    action: ContactScience
    actor: EV1
    asset: assets/incoming/tool_apxs
    data: {status: DERIVED, note: "EV1_XRF uses the APXS precision model (D018); composition SCENARIO"}
    duration_min: 15
    purpose:
      tr: "Astronot el tipi XRF'i yüzeye tutar; hızlı ama standoff'a duyarlı bir kimya okuması."
      en: "The astronaut holds the handheld XRF to the surface: a quick chemistry read that is sensitive to standoff."
  B2_LIBS_AEGIS:
    spec: proje.md §9.2 B2
    action: RemoteLibs
    actor: rover_1
    asset: assets/incoming/tool_libs
    data: {status: SCENARIO, note: "ChemCam RDR not fetched; range <= 7 m and first-shot dust are spec [?] items"}
    duration_min: 15
    purpose:
      tr: "Rover direği uzaktan lazerle 1×5 nokta tarar; hedefi boş bırakırsan rover kendisi seçer (AEGIS benzeri)."
      en: "The rover mast fires a 1x5 laser raster from a distance; leave the target empty and the rover picks one (AEGIS-like)."
  B3_MULTISPECTRAL:
    spec: proje.md §9.2 B3
    action: MultispectralImage
    actor: EV1
    asset: assets/incoming/tool_multispectral
    data: {status: SCENARIO, note: "splib07 and Mastcam filter curves not fetched; spectral index is SIMULATED"}
    duration_min: 5
    purpose:
      tr: "Filtreli kamerayla panorama; renk indeksi hangi kayaya ölçüm yapılacağını seçmeye yardım eder."
      en: "A filtered-camera panorama; the colour index helps choose which rock to measure."
  B4_DAN_SURVEY:
    spec: proje.md §9.2 B4
    action: NeutronSurvey
    actor: rover_1
    asset: assets/incoming/tool_neutron
    data: {status: SCENARIO, note: "DAN RDR not fetched; WEH truth SCENARIO; GP posterior and its sigma go to the tablet as a field"}
    duration_min: 45
    purpose:
      tr: "Rover durup nötron sayar; bir sonraki nokta en belirsiz ve ulaşması ucuz yer. Yeraltı su eşdeğeri haritası ve belirsizliği tablete gelir."
      en: "The rover stops and counts neutrons; the next point is the most uncertain, cheapest-to-reach place. A subsurface water-equivalent map and its uncertainty reach the tablet."
  B5_DRILL_FDIR:
    spec: proje.md §9.2 B5
    action: Drill
    actor: rover_1
    asset: assets/incoming/tool_drill
    data: {status: SCENARIO, note: "hardness and torque model SCENARIO; the 2016 Curiosity drill feed fault is a history reference [?]"}
    duration_min: 40
    purpose:
      tr: "Rover matkabı 5 cm'e iner; sıkışmada (stall) geri çeker, beslemeyi azaltır, darbeli moda geçer. Sonuç bir toz numunesidir."
      en: "The rover drill goes to 5 cm; on a stall it retracts, lowers the feed and switches to percussive mode. The result is a powder sample."
  B6_COLLECT:
    spec: proje.md §9.2 B6
    action: CollectSample
    actor: EV1
    asset: assets/incoming/sample_tube
    data: {status: SCENARIO, note: "sample chain states of SampleRecord; Mars 2020 sample dossier structure is a [K] reference"}
    duration_min: 10
    purpose:
      tr: "Astronot yüzey numunesini tüpe alır; kökeni (nokta, derinlik, zaman) kayda girer ve bir daha değişmez."
      en: "The astronaut takes a surface sample into a tube; its origin (point, depth, time) is recorded and never changes."
  B6_CACHE:
    spec: proje.md §9.2 B6
    action: CacheSample
    actor: EV1
    asset: assets/incoming/sample_case
    data: {status: SCENARIO, note: "duplicate-command protection by request id; one sample per container"}
    duration_min: 5
    purpose:
      tr: "Tüp taşıma kutusuna kilitlenir; numune zinciri kopmadan laboratuvara gider."
      en: "The tube is locked into the carry case so the sample chain reaches the lab unbroken."
  B7_ENV_STATION:
    spec: proje.md §9.2 B7
    action: DeployStation
    actor: EV1
    asset: assets/incoming/science_station
    data: {status: ARCHIVE, note: "dose is the real MSL RAD replay (sol 4190); weather needs REMS, not fetched"}
    duration_min: 15
    purpose:
      tr: "Doz ve hava istasyonu kurulur; uzay havası alarmı sahada da görünür olur."
      en: "A dose and weather station is set up so a space-weather alarm is visible in the field too."
  B10_FIELD_NOTE:
    spec: proje.md §9.2 B10
    action: science_note
    actor: EV1
    asset: assets/incoming/station_marker
    data: {status: SCENARIO, note: "photo, note and target flag on /crew/EV1/science_note; the backroom answers after the light time"}
    duration_min: 5
    purpose:
      tr: "Fotoğraf, not ve hedef bayrağı; bilim arka odası ışık gecikmesiyle cevap verir."
      en: "Photo, note and target flag; the science backroom answers after the light-time delay."
  LAB_PH_CHEM:
    spec: research/notes/SAHA_VE_BILIM_ISTASYONU.md §4
    action: lab_analysis
    actor: EV1
    asset: assets/incoming/lab_bench
    data: {status: SCENARIO, note: "simulated lab analysis; Phoenix WCL (pH 7.7 +/- 0.3, Kounaves et al. 2010) is a procedure reference from another site, never a Gale result"}
    duration_min: 30
    purpose:
      tr: "Laboratuvarda numune hazırlanır; pH, iletkenlik ve bileşim ölçülür ve numunenin alındığı noktaya bağlanır."
      en: "In the lab the sample is prepared; pH, conductivity and composition are measured and tied to where it was taken."
  SCOUT_CORRIDOR:
    spec: proje.md §7.11, §18 T7
    action: ExecuteScout
    actor: scout_1
    asset: assets/incoming/scout_1
    data: {status: SIMULATED, note: "scout_stub over hidden SCENARIO truth; corridor survey policy (D015)"}
    duration_min: 20
    purpose:
      tr: "Drone yürüyüş koridorunu önden tarar; engel bulursa rota yeniden planlanır."
      en: "The drone surveys the walking corridor ahead; if it finds an obstacle the route is replanned."
stations:
  - id: ST-H
    role: infrastructure
    xy_m: [262.0, -430.0]
    name: {tr: "Habitat önü", en: "Habitat apron"}
    purpose:
      tr: "Çevre istasyonu ve drone kalkışı; bütün yürüyüşler buradan başlar."
      en: "Environment station and drone launch; every walk starts here."
    tasks: [B7_ENV_STATION, SCOUT_CORRIDOR]
  - id: ST-E1
    role: control
    target_id: BXW-T10
    expected_class: hollow
    name: {tr: "Doğu çukuru", en: "East hollow"}
    purpose:
      tr: "Kontrol: bilinen örüntüde bir çukur karbonat imzası vermeli. Yüzey numunesi laboratuvara gider."
      en: "Control: a hollow on the known pattern should show the carbonate signature. A surface sample goes to the lab."
    tasks: [B10_FIELD_NOTE, B1_XRF_HAND, B6_COLLECT, B6_CACHE]
  - id: ST-E2
    role: control
    target_id: BXW-T01
    expected_class: ridge
    name: {tr: "Kuzeydoğu sırtı", en: "Northeast ridge"}
    purpose:
      tr: "Kontrol: bilinen örüntüde bir sırt kil imzası vermeli. Rover LIBS'i ve kamera burada sınanır."
      en: "Control: a ridge on the known pattern should show the clay signature. The rover LIBS and the camera are checked here."
    tasks: [B3_MULTISPECTRAL, B2_LIBS_AEGIS]
  - id: ST-W1
    role: test
    target_id: BXW-T05
    expected_class: ridge
    name: {tr: "Batı sırtı", en: "West ridge"}
    purpose:
      tr: "Test: batıdaki sırt da kil imzası veriyor mu? Rover APXS'i arşivden kalibre hata çubuklarıyla ölçer."
      en: "Test: does the west ridge show the clay signature too? The rover APXS measures with archive-calibrated error bars."
    tasks: [B3_MULTISPECTRAL, B1_APXS_ARM, B10_FIELD_NOTE]
  - id: ST-W2
    role: test
    target_id: BXW-T08
    expected_class: hollow
    name: {tr: "Kuzeybatı çukuru", en: "Northwest hollow"}
    purpose:
      tr: "Test: batıdaki çukur karbonat imzası veriyor mu? Rover sondaj yapar; toz numune tüple laboratuvara gider."
      en: "Test: does the west hollow show the carbonate signature? The rover drills; the powder sample goes to the lab in a tube."
    tasks: [B5_DRILL_FDIR, B1_APXS_ARM, B6_COLLECT, B6_CACHE]
  - id: ST-W3
    role: test
    target_id: BXW-T09
    expected_class: hollow
    name: {tr: "Uzak batı (rover)", en: "Far west (rover)"}
    purpose:
      tr: "Test, yalnız robot: rover uzak batıda nötron taraması yapar; insan buraya yürümez."
      en: "Test, robot only: the rover runs a neutron survey in the far west; no one walks here."
    tasks: [B4_DAN_SURVEY]
  - id: ST-LAB
    role: infrastructure
    xy_m: [285.1, -468.0]
    name: {tr: "Bilim laboratuvarı (H05)", en: "Science lab (H05)"}
    purpose:
      tr: "Getirilen numunelerin pH ve bileşim analizi; sonuç numunenin köken noktasına bağlanır."
      en: "pH and composition analysis of returned samples; each result is tied to the sample's origin."
    tasks: [LAB_PH_CHEM]
