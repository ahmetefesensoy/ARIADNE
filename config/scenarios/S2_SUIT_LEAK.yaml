# S2: suit leak on EV2 (proje.md §16 S2, §8.7 SUIT_LEAK, §17: limiting = O2 and EV2; D015 leak factor).
provenance_status: SCENARIO
note: >-
  Same start and plan request as S0 (2024-05-21 04:00 UTC, no SEP alarm in the real RAD E series,
  dusk about 9 h away). At PET 50 min, while the crew works at the first station, EV2's suit
  starts leaking: ev_sim multiplies EV2's O2 consumption by 3 (SCENARIO). The leak is not
  announced to the safety chain; rule_monitor must find it from EV2's telemetry (O2 rate vs the
  metabolic model) and mission_manager must turn the crew home. Expected: the red line narrows
  to EV2 with O2 as the limit, and the return margin stays >= 0 (FR-01). Dose values are ARCHIVE
  RAD; crew, timing, the leak and the rules are scenario choices.
