[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-data"
version = "0.1.0"
description = "REDLINE bounded planetary data pipeline"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
redline-data = "redline_data.cli:main"

[project.optional-dependencies]
test = ["pytest==8.3.5"]
data = ["numpy==1.26.4", "rasterio==1.4.3", "pyproj==3.7.1", "jsonschema==4.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
